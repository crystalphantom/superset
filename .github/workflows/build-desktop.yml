name: Build Desktop App

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel (stable or canary)"
        required: true
        type: string
      version_suffix:
        description: "Version suffix to append (e.g., -canary). Empty for stable."
        required: false
        type: string
        default: ""
      electron_builder_config:
        description: "Electron builder config file"
        required: false
        type: string
        default: "electron-builder.ts"
      artifact_prefix:
        description: "Prefix for artifact names"
        required: false
        type: string
        default: "desktop"
      artifact_retention_days:
        description: "Number of days to retain artifacts"
        required: false
        type: number
        default: 30

jobs:
  build-macos:
    name: Build - macOS (${{ matrix.arch }})
    runs-on: macos-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Set version suffix
        if: inputs.version_suffix != ''
        working-directory: apps/desktop
        run: |
          # Read current version and append suffix
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}${{ inputs.version_suffix }}"
          echo "Setting version to: $NEW_VERSION"
          # Update package.json version using node
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          echo "Updated package.json version to $NEW_VERSION"

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Validate self-host URL inputs
        env:
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ secrets.NEXT_PUBLIC_ELECTRIC_URL || vars.NEXT_PUBLIC_ELECTRIC_URL }}
          RELAY_URL: ${{ secrets.RELAY_URL || vars.RELAY_URL }}
          SUPERSET_API_URL: ${{ vars.SUPERSET_API_URL || secrets.SUPERSET_API_URL }}
          SUPERSET_WEB_URL: ${{ vars.SUPERSET_WEB_URL || secrets.SUPERSET_WEB_URL }}
        run: |
          node <<'NODE'
          const required = [
            "NEXT_PUBLIC_WEB_URL",
            "NEXT_PUBLIC_API_URL",
            "NEXT_PUBLIC_ELECTRIC_URL",
            "RELAY_URL",
            "SUPERSET_API_URL",
            "SUPERSET_WEB_URL",
          ];
          const missing = required.filter((name) => !process.env[name]);
          const invalid = required.filter((name) => {
            const value = process.env[name];
            if (!value) return false;
            try {
              new URL(value);
              return false;
            } catch {
              return true;
            }
          });
          const upstreamDefaults = new Map([
            ["NEXT_PUBLIC_API_URL", "https://api.superset.sh"],
            ["NEXT_PUBLIC_WEB_URL", "https://app.superset.sh"],
            ["RELAY_URL", "https://relay.superset.sh"],
            ["SUPERSET_API_URL", "https://api.superset.sh"],
            ["SUPERSET_WEB_URL", "https://app.superset.sh"],
          ]);
          const upstream = required.filter((name) => {
            const value = process.env[name];
            const expected = upstreamDefaults.get(name);
            if (!value || !expected) return false;
            try {
              return new URL(value).origin === expected;
            } catch {
              return false;
            }
          });

          if (missing.length || invalid.length || upstream.length) {
            if (missing.length) console.error(`Missing variables: ${missing.join(", ")}`);
            if (invalid.length) console.error(`Invalid URL variables: ${invalid.join(", ")}`);
            if (upstream.length) console.error(`Upstream default URLs are not allowed: ${upstream.join(", ")}`);
            process.exit(1);
          }

          console.log("Desktop release URL inputs OK");
          NODE

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_STREAMS_URL: ${{ secrets.NEXT_PUBLIC_STREAMS_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ secrets.NEXT_PUBLIC_ELECTRIC_URL || vars.NEXT_PUBLIC_ELECTRIC_URL }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL || vars.RELAY_URL }}
          SUPERSET_API_URL: ${{ vars.SUPERSET_API_URL || secrets.SUPERSET_API_URL }}
          SUPERSET_WEB_URL: ${{ vars.SUPERSET_WEB_URL || secrets.SUPERSET_WEB_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun run compile:app

      - name: Build Electron app
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bun run package -- --publish never --config ${{ inputs.electron_builder_config }} --${{ matrix.arch }}

      - name: Verify app-update.yml exists
        working-directory: apps/desktop
        run: |
          # electron-builder uses mac-arm64/ for arm64 and mac/ for x64 (when host is arm64)
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found in release/"
            ls -la release/
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"
          test -f "$APP_DIR/Contents/Resources/app-update.yml" || {
            echo "::error::app-update.yml missing from $APP_DIR/Contents/Resources/ — auto-update will be broken"
            exit 1
          }
          CLI_BIN="$APP_DIR/Contents/Resources/resources/bin/superset"
          test -x "$CLI_BIN" || {
            echo "::error::Bundled Superset CLI missing or not executable at $CLI_BIN"
            exit 1
          }
          "$CLI_BIN" --version

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-dmg
          path: apps/desktop/release/*.dmg
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-zip
          path: apps/desktop/release/*.zip
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload auto-update manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-update-manifest
          path: apps/desktop/release/*-mac.yml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  build-linux:
    name: Build - Linux (x64)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Install Linux native build deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Set version suffix
        if: inputs.version_suffix != ''
        working-directory: apps/desktop
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}${{ inputs.version_suffix }}"
          echo "Setting version to: $NEW_VERSION"
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          echo "Updated package.json version to $NEW_VERSION"

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Validate self-host URL inputs
        env:
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ secrets.NEXT_PUBLIC_ELECTRIC_URL || vars.NEXT_PUBLIC_ELECTRIC_URL }}
          RELAY_URL: ${{ secrets.RELAY_URL || vars.RELAY_URL }}
          SUPERSET_API_URL: ${{ vars.SUPERSET_API_URL || secrets.SUPERSET_API_URL }}
          SUPERSET_WEB_URL: ${{ vars.SUPERSET_WEB_URL || secrets.SUPERSET_WEB_URL }}
        run: |
          node <<'NODE'
          const required = [
            "NEXT_PUBLIC_WEB_URL",
            "NEXT_PUBLIC_API_URL",
            "NEXT_PUBLIC_ELECTRIC_URL",
            "RELAY_URL",
            "SUPERSET_API_URL",
            "SUPERSET_WEB_URL",
          ];
          const missing = required.filter((name) => !process.env[name]);
          const invalid = required.filter((name) => {
            const value = process.env[name];
            if (!value) return false;
            try {
              new URL(value);
              return false;
            } catch {
              return true;
            }
          });
          const upstreamDefaults = new Map([
            ["NEXT_PUBLIC_API_URL", "https://api.superset.sh"],
            ["NEXT_PUBLIC_WEB_URL", "https://app.superset.sh"],
            ["RELAY_URL", "https://relay.superset.sh"],
            ["SUPERSET_API_URL", "https://api.superset.sh"],
            ["SUPERSET_WEB_URL", "https://app.superset.sh"],
          ]);
          const upstream = required.filter((name) => {
            const value = process.env[name];
            const expected = upstreamDefaults.get(name);
            if (!value || !expected) return false;
            try {
              return new URL(value).origin === expected;
            } catch {
              return false;
            }
          });

          if (missing.length || invalid.length || upstream.length) {
            if (missing.length) console.error(`Missing variables: ${missing.join(", ")}`);
            if (invalid.length) console.error(`Invalid URL variables: ${invalid.join(", ")}`);
            if (upstream.length) console.error(`Upstream default URLs are not allowed: ${upstream.join(", ")}`);
            process.exit(1);
          }

          console.log("Desktop release URL inputs OK");
          NODE

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ secrets.NEXT_PUBLIC_WEB_URL || vars.NEXT_PUBLIC_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_STREAMS_URL: ${{ secrets.NEXT_PUBLIC_STREAMS_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ secrets.NEXT_PUBLIC_ELECTRIC_URL || vars.NEXT_PUBLIC_ELECTRIC_URL }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL || vars.RELAY_URL }}
          SUPERSET_API_URL: ${{ vars.SUPERSET_API_URL || secrets.SUPERSET_API_URL }}
          SUPERSET_WEB_URL: ${{ vars.SUPERSET_WEB_URL || secrets.SUPERSET_WEB_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: x64
        run: bun run compile:app

      - name: Build Electron app
        working-directory: apps/desktop
        run: bun run package -- --publish never --config ${{ inputs.electron_builder_config }}

      - name: Verify Linux AppImage + update manifest exist
        working-directory: apps/desktop
        run: |
          ls -la release
          test -n "$(ls -1 release/*.AppImage 2>/dev/null)" || {
            echo "::error::No AppImage artifact generated in apps/desktop/release"
            exit 1
          }
          test -n "$(ls -1 release/*-linux.yml 2>/dev/null)" || {
            echo "::error::No Linux auto-update manifest generated in apps/desktop/release"
            exit 1
          }
          CLI_BIN=$(find release -path "*/resources/resources/bin/superset" -type f -perm -111 | head -1)
          if [ -z "$CLI_BIN" ]; then
            echo "::error::Bundled Superset CLI missing or not executable in packaged Linux output"
            exit 1
          fi
          "$CLI_BIN" --version

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-linux-appimage
          path: apps/desktop/release/*.AppImage
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload Linux auto-update manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-linux-update-manifest
          path: apps/desktop/release/*-linux.yml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
